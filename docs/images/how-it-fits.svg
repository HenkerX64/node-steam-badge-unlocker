<svg xmlns="http://www.w3.org/2000/svg" width="880" height="210" viewBox="0 0 880 210" role="img" aria-label="Your script logs in your accounts and hands the sessions to steam-badge-unlocker, which runs the open tasks on Steam"><title>Your script logs in your accounts and hands the sessions to steam-badge-unlocker, which runs the open tasks on Steam</title><defs><linearGradient id="hf-on" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f4864"/><stop offset="1" stop-color="#0f1824"/></linearGradient></defs><rect width="880" height="210" rx="10" fill="#1b2838"/><text x="16" y="24" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" font-weight="600">A library, not an app: your script brings the accounts</text><rect x="16" y="40" width="250" height="120" rx="8" fill="#16191d" stroke="#3a4350" stroke-width="1"/><text x="32" y="70" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#ffffff" font-weight="600">Your script</text><text x="32" y="98" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#c6d4df">logs in your accounts</text><text x="32" y="120" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#c6d4df">the example: accounts.csv</text><path d="M266 100 H322" stroke="#c6d4df" stroke-width="2"/><path d="M330 100 L320 94 V106 Z" fill="#c6d4df"/><text x="298" y="88" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#8f98a0" text-anchor="middle">sessions</text><rect x="330" y="40" width="250" height="120" rx="8" fill="#16191d" stroke="#3987e5" stroke-width="2"/><text x="346" y="70" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#ffffff" font-weight="600">steam-badge-unlocker</text><text x="346" y="98" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#c6d4df">reads the open tasks,</text><text x="346" y="120" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#c6d4df">runs them, cleans up</text><path d="M580 100 H636" stroke="#c6d4df" stroke-width="2"/><path d="M644 100 L634 94 V106 Z" fill="#c6d4df"/><text x="612" y="88" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#8f98a0" text-anchor="middle">requests</text><rect x="644" y="40" width="220" height="120" rx="8" fill="#16191d" stroke="#3a4350" stroke-width="1"/><text x="660" y="70" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#ffffff" font-weight="600">Steam</text><text x="660" y="98" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#c6d4df">badge page:</text><text x="660" y="120" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#c6d4df">grey tasks turn lit</text><text x="16" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#8f98a0">steam-user + steamcommunity log in; the library never sees a password.</text></svg>
