<svg xmlns="http://www.w3.org/2000/svg" width="880" height="452" viewBox="0 0 880 452" role="img" aria-label="Timeline of a run with 12 bots: each bot takes about 6 minutes, so bots 11 and 12 reach PostVideo after the one-hour YouTube token expired"><title>Timeline of a run with 12 bots: each bot takes about 6 minutes, so bots 11 and 12 reach PostVideo after the one-hour YouTube token expired</title><defs><linearGradient id="rt-on" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f4864"/><stop offset="1" stop-color="#0f1824"/></linearGradient></defs><rect width="880" height="452" rx="10" fill="#1b2838"/><text x="28" y="34" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#ffffff" font-weight="600">Why late bots miss PostVideo</text><text x="28" y="56" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#8f98a0">The example script runs the bots one after another. PlayGame alone holds each bot 5:30 (playSeconds 330).</text><rect x="90" y="90" width="625" height="276" fill="#199e70" opacity="0.12"/><path d="M715 84 V368" stroke="#199e70" stroke-width="2" stroke-dasharray="5 4"/><text x="707" y="82" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#c6d4df" text-anchor="end">YouTube token expires (~60 min)</text><path d="M90 368 V373" stroke="#8f98a0"/><text x="90" y="388" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8f98a0" text-anchor="middle">0 min</text><path d="M194.16666666666669 368 V373" stroke="#8f98a0"/><text x="194.16666666666669" y="388" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8f98a0" text-anchor="middle">10 min</text><path d="M298.33333333333337 368 V373" stroke="#8f98a0"/><text x="298.33333333333337" y="388" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8f98a0" text-anchor="middle">20 min</text><path d="M402.5 368 V373" stroke="#8f98a0"/><text x="402.5" y="388" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8f98a0" text-anchor="middle">30 min</text><path d="M506.6666666666667 368 V373" stroke="#8f98a0"/><text x="506.6666666666667" y="388" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8f98a0" text-anchor="middle">40 min</text><path d="M610.8333333333334 368 V373" stroke="#8f98a0"/><text x="610.8333333333334" y="388" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8f98a0" text-anchor="middle">50 min</text><path d="M715 368 V373" stroke="#8f98a0"/><text x="715" y="388" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8f98a0" text-anchor="middle">60 min</text><path d="M819.1666666666666 368 V373" stroke="#8f98a0"/><text x="819.1666666666666" y="388" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8f98a0" text-anchor="middle">70 min</text><text x="78" y="111" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#c6d4df" text-anchor="end">Bot 1</text><rect x="90" y="101" width="60.5" height="12" rx="2" fill="#3987e5" opacity="0.55"/><circle cx="92.60416666666667" cy="107" r="4.5" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="78" y="133" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#c6d4df" text-anchor="end">Bot 2</text><rect x="152.5" y="123" width="60.5" height="12" rx="2" fill="#3987e5" opacity="0.55"/><circle cx="155.10416666666669" cy="129" r="4.5" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="78" y="155" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#c6d4df" text-anchor="end">Bot 3</text><rect x="215" y="145" width="60.5" height="12" rx="2" fill="#3987e5" opacity="0.55"/><circle cx="217.60416666666669" cy="151" r="4.5" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="78" y="177" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#c6d4df" text-anchor="end">Bot 4</text><rect x="2