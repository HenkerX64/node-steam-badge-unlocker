<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" role="img" aria-label="The master account is the friend of every bot; the bots run their open tasks one after another"><title>The master account is the friend of every bot; the bots run their open tasks one after another</title><defs><linearGradient id="mb-on" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f4864"/><stop offset="1" stop-color="#0f1824"/></linearGradient></defs><rect width="880" height="380" rx="10" fill="#1b2838"/><text x="28" y="36" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#ffffff" font-weight="600">One run: a master and its bots</text><text x="28" y="58" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#8f98a0">The master is the friend of every bot. The bots run one after another.</text><circle cx="180" cy="190" r="78" fill="#16191d" stroke="#d95926" stroke-width="2.5"/><text x="180" y="182" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#ffffff" font-weight="700" text-anchor="middle">Master</text><text x="180" y="204" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#c6d4df" text-anchor="middle">row 1, full account</text><text x="180" y="296" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#8f98a0" text-anchor="middle">runs no tasks in this run</text><text x="180" y="314" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#8f98a0" text-anchor="middle">stays online while bots need it</text><rect x="520" y="92" width="320" height="62" rx="8" fill="#16191d" stroke="#3987e5" stroke-width="2"/><text x="540" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#ffffff" font-weight="600">Bot 1</text><text x="540" y="139" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#c6d4df">runs its open tasks</text><path d="M262 190 L512 123" stroke="#8f98a0" stroke-width="1.4"/><path d="M516 123 L505 115 L507 127 Z" fill="#8f98a0"/><rect x="520" y="176" width="320" height="62" rx="8" fill="#16191d" stroke="#3987e5" stroke-width="2"/><text x="540" y="202" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#ffffff" font-weight="600">Bot 2</text><text x="540" y="223" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#c6d4df">starts when Bot 1 is done</text><path d="M262 190 L512 207" stroke="#8f98a0" stroke-width="1.4"/><path d="M516 207 L505 201 L507 213 Z" fill="#8f98a0"/><rect x="520" y="260" width="320" height="62" rx="8" fill="#16191d" stroke="#3987e5" stroke-width="2"/><text x="540" y="286" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#ffffff" font-weight="600">Bot 3, 4, …</text><text x="540" y="307" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#c6d4df">one after another</text><path d="M262 190 L512 291" stroke="#8f98a0" stroke-width="1.4"/><path d="M516 291 L505 287 L507 299 Z" fill="#8f98a0"/><text x="390" y="166" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#8f98a0" text-anchor="middle">friend invite,</text><text x="390" y="182" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#8f98a0" text-anchor="middle">comments, votes, chat</text><text x="28" y="352" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#8f98a0">finish() removes the friend again when forceRemoveFriend is set; the example script sets it.</text></svg>
