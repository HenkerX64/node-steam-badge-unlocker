name: Tests

on:
  push:
    branches:
      - release/*
  pull_request:
    branches: [ master ]
  workflow_call:

jobs:
  test:
    name: 'Node.js v${{ matrix.node }}'
    runs-on: ubuntu-latest
    env:
      TEST_ACCOUNTS: ${{ secrets.TEST_ACCOUNTS }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        node:
          - 16  # EOL: 2023-08
          - 22  # EOL: 2025-10
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/setup-node@v3
        with:
          node-version: '${{ matrix.node }}'
      - uses: actions/checkout@v4
      - name: 'Cache node_modules'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-v${{ matrix.node }}-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-v${{ matrix.node }}-

      - name: Install Dependencies
        run: |
          npm install
          npm run build --if-present
      - name: Run node.js tests
        run: npm run test

  types:
    name: 'Type declarations'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v3
        with:
          node-version: 'lts/*'
      - uses: actions/checkout@v4
      - name: 'Cache node_modules'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-lts-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-lts-

      - name: Install Dependencies
        run: npm install
      - name: 'TypeScript 5.9.3: consumer tests, consumer patterns, API snapshot, runtime JSDoc, parity'
        run: npm run test-types
      - name: 'TypeScript 4.0.5: consumer tests'
        run: npm run test-types-floor
      - name: 'TypeScript latest: consumer tests, consumer patterns and the packed package'
        run: npm run test-types-latest
